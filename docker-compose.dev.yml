version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: lang-assessment-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lang-assessment-network

  # MinIO (S3-compatible Object Storage)
  minio:
    image: minio/minio:latest
    container_name: lang-assessment-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lang-assessment-network

  # EdgeTTS Server (Free, No Billing Required)
  edge-tts:
    build:
      context: ./edge-tts-server
      dockerfile: Dockerfile
    container_name: lang-assessment-edge-tts
    ports:
      - "5001:5001"
    environment:
      FLASK_ENV: development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lang-assessment-network
    depends_on:
      postgres:
        condition: service_healthy

  # Backend Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lang-assessment-backend
    ports:
      - "8080:8080"
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # MinIO
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

      # Gemini API (for question generation)
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # TTS Configuration (Using EdgeTTS - FREE, No Billing)
      TTS_PROVIDER: ${TTS_PROVIDER}
      EDGE_TTS_API_URL: ${EDGE_TTS_API_URL}

      # Mail (for scorecard sharing)
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}

      # Application
      APP_BASE_URL: ${APP_BASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      edge-tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lang-assessment-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  lang-assessment-network:
    driver: bridge
