version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: lang-assessment-db
    environment:
      POSTGRES_DB: ${DB_NAME:lang_assessment}
      POSTGRES_USER: ${DB_USER:postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:password123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible Object Storage)
  minio:
    image: minio/minio:latest
    container_name: lang-assessment-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # EdgeTTS Server (Free, No Billing Required)
  edge-tts:
    build:
      context: ./edge-tts-server
      dockerfile: Dockerfile
    container_name: lang-assessment-edge-tts
    ports:
      - "5001:5001"
    environment:
      FLASK_ENV: development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - postgres

  # Backend Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lang-assessment-backend
    ports:
      - "8080:8080"
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:lang_assessment}
      DB_USER: ${DB_USER:postgres}
      DB_PASSWORD: ${DB_PASSWORD:password123}

      # MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:minioadmin123}

      # JWT
      JWT_SECRET: ${JWT_SECRET:your-secret-key-change-in-production-min-32-chars-required}

      # Gemini API (for question generation)
      GEMINI_API_KEY: ${GEMINI_API_KEY:}

      # TTS Configuration (Using EdgeTTS - FREE, No Billing)
      TTS_PROVIDER: edge
      EDGE_TTS_API_URL: http://edge-tts:5001/tts

      # Mail (for scorecard sharing)
      MAIL_HOST: ${MAIL_HOST:smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:587}
      MAIL_USERNAME: ${MAIL_USERNAME:}
      MAIL_PASSWORD: ${MAIL_PASSWORD:}
      MAIL_FROM: ${MAIL_FROM:noreply@langassessment.com}

      # Application
      APP_BASE_URL: ${APP_BASE_URL:http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:INFO}

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      edge-tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  minio_data:

networks:
  default:
    name: lang-assessment-network
